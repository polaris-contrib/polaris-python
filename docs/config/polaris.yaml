# Polaris Python SDK 配置参考。
#
# 本文件列出当前 SDK 支持的公开配置字段，字段值为默认值。
# [预留] 表示字段可加载和校验，但对应能力尚未生效。
# 时长支持整数毫秒或 ns/us/ms/s/m/h 组合，例如 500ms、1s、1m30s。
# 字符串空值写 ""，不要写 null。
# 支持 ${ENV}、$ENV 和 ${ENV:default} 占位符；日志使用独立 LogOptions。
# 本文件不参与默认配置文件查找，环境变量和优先级见 environment-variables.md。

# global 是 Provider、Consumer 和其他 API 共享的全局配置。
global:
  system:
    # 描述: SDK 运行模式。
    # 类型: enum
    # 格式: YAML 整数。
    # 范围: 0=直连 Polaris；1=代理模式。
    # 默认值: 0
    # 注意: 代理模式尚未实现，业务当前应使用 0。
    mode: 0
    discoverCluster:
      # 描述: 服务发现系统集群命名空间。
      # 类型: string
      # 格式: 非空字符串表示启用；空字符串表示不使用该集群。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: ""
      # 注意: 空值时直接使用 serverConnector.addresses；非空时先经 bootstrap 二次发现。
      namespace: ""
      # 描述: 服务发现系统集群服务名。
      # 类型: string
      # 格式: 非空字符串表示启用；空字符串表示不使用该集群。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: ""
      # 注意: namespace 和 service 必须同时非空才会参与系统服务装配。
      service: ""
      # 描述: 服务发现集群刷新间隔。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >=100ms。
      # 默认值: 1m
      # 注意: 控制该系统服务实例的后台 Discover 刷新周期。
      refreshInterval: 1m
    healthCheckCluster:
      # 描述: 健康检查系统集群命名空间。
      # 类型: string
      # 格式: 非空字符串表示启用；空字符串表示不使用该集群。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: ""
      # 注意: 空值时心跳直接使用 serverConnector.addresses；非空时先经 bootstrap 二次发现。
      namespace: ""
      # 描述: 健康检查系统集群服务名。
      # 类型: string
      # 格式: 非空字符串表示启用；空字符串表示不使用该集群。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: ""
      # 注意: namespace 和 service 必须同时非空才会参与系统服务装配。
      service: ""
      # 描述: 健康检查集群刷新间隔。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >=100ms。
      # 默认值: 1m
      # 注意: 控制该系统服务实例的后台 Discover 刷新周期。
      refreshInterval: 1m
    monitorCluster:
      # 描述: 监控系统集群命名空间。
      # 类型: string
      # 格式: 非空字符串表示命名空间。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: Polaris
      # 注意: 显式配置 service 而未配置 namespace 时，set_default 会补为 Polaris。
      namespace: Polaris
      # 描述: 监控系统集群服务名。
      # 类型: string
      # 格式: 非空字符串表示服务名。
      # 范围: 任意 UTF-8 字符串。
      # 默认值: polaris.monitor
      # 注意: 显式配置 namespace 而未配置 service 时，set_default 会补为 polaris.monitor。
      service: polaris.monitor
      # 描述: 监控集群刷新间隔。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >=100ms。
      # 默认值: 1m
      # 注意: push 未显式配置 address 时使用该集群发现 Pushgateway 实例。
      refreshInterval: 1m

  api:
    # 描述: API 默认超时。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 1s
    # 注意: 限制每类资源首次 Discover 的远端等待；磁盘读取和重试耗时另算。
    timeout: 1s
    # 描述: SDK 自身 IP 的显式配置。
    # 类型: string
    # 格式: IPv4 或 IPv6 地址。
    # 范围: 合法 IP；空字符串表示未指定。
    # 默认值: ""
    # 注意: 优先于 bindIf 和 TCP 自动探测；不是注册业务实例的 host。
    bindIP: ""
    # 描述: SDK 自身 IP 的网卡名称。
    # 类型: string
    # 格式: 操作系统网卡名。
    # 范围: 存在且至少有一个 IP 的网卡；空字符串表示未指定。
    # 默认值: ""
    # 注意: bindIP 非空时忽略本字段；网卡不存在或无 IP 时启动报错。
    bindIf: ""
    # 描述: SDK 客户端信息上报周期。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 60s
    # 注意: 独立于 statReporter.enable；客户端身份仍按该周期上报。
    reportInterval: 60s
    # 描述: 网络错误最大重试次数。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >=0；显式 0 会回退为默认值 1。
    # 默认值: 1
    # 注意: 不能通过 0 禁用重试。
    maxRetryTimes: 1
    # 描述: 重试退避初始间隔。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=1s。
    # 默认值: 1s
    # 注意: 表示初始间隔，后续退避由内部流程控制。
    retryInterval: 1s

  serverConnector:
    # 描述: Polaris gRPC 服务端地址列表。
    # 类型: list[string]
    # 格式: host:port 或 [IPv6]:port。
    # 范围: 至少 1 项，端口 1-65535。
    # 默认值: [127.0.0.1:8091]
    # 注意: 可在项中使用 ${POLARIS_SERVER_ADDRESS:127.0.0.1:8091} 提供默认地址。
    addresses: [127.0.0.1:8091]
    # 描述: 服务端连接协议。
    # 类型: string
    # 格式: 已注册连接器名称。
    # 范围: grpc。
    # 默认值: grpc
    # 注意: 当前只支持 gRPC。
    protocol: grpc
    # 描述: 连接 Polaris 的访问令牌。
    # 类型: string
    # 格式: 服务端签发的 token。
    # 范围: 任意字符串；空值表示未鉴权。
    # 默认值: ""
    # 注意: 这是接入令牌，不是注册、心跳或反注册使用的 service token。
    token: ""
    # 描述: SDK 自身 IP 自动探测的 TCP 连接超时。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 500ms
    # 注意: 只用于 bindIP / bindIf 均未配置时的本地源 IP 探测。
    connectTimeout: 500ms
    # 描述: 一元 gRPC 请求超时。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 1500ms
    # 注意: 不用于 Discover 长连接，与 global.api.timeout 不是同一字段。
    messageTimeout: 1500ms
    # 描述: 长连接空闲释放时间。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=100ms。
    # 默认值: 3s
    # 注意: [预留] 当前不控制通道池和空闲回收。
    connectionIdleTimeout: 3s
    # 描述: 首次请求队列容量。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >=0。
    # 默认值: 1000
    # 注意: [预留] 当前不会按队列容量拒绝请求；显式 0 会被保留。
    requestQueueSize: 1000
    # 描述: 服务端节点切换周期。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >connectionIdleTimeout。
    # 默认值: 10m
    # 注意: 多地址时按该周期轮换目标，并关闭旧目标上的 Discover 流促使其重建。
    serverSwitchInterval: 10m
    # 描述: TLS 信任根证书文件。
    # 类型: string
    # 格式: PEM 文件路径。
    # 范围: 空值或可读取、可解析的 PEM 文件。
    # 默认值: ""
    # 注意: 非空时启用 TLS 服务端证书校验；文件缺失或格式错误会拒绝启动。
    trustedCAFile: ""
    # 描述: mTLS 客户端证书文件。
    # 类型: string
    # 格式: PEM 文件路径。
    # 范围: 必须与 keyFile 同时配置或同时为空。
    # 默认值: ""
    # 注意: 证书和私钥不完整或不匹配时拒绝启动。
    certFile: ""
    # 描述: mTLS 客户端私钥文件。
    # 类型: string
    # 格式: PEM 文件路径。
    # 范围: 必须与 certFile 同时配置或同时为空。
    # 默认值: ""
    # 注意: 私钥文件只用于建立客户端 TLS 身份。
    keyFile: ""
    # 描述: gRPC 连接器插件参数。
    # 类型: map[string]map[string]any
    # 格式: 插件名为第一层 key，参数为第二层 mapping。
    # 范围: 当前 gRPC 连接器没有读取的参数。
    # 默认值: {}
    # 注意: [预留] 可加载但不会改变连接行为。
    plugin: {}

  admin:
    # 描述: metrics HTTP 监听地址。
    # 类型: string
    # 格式: IPv4、IPv6 或主机名。
    # 范围: 非空字符串。
    # 默认值: 0.0.0.0
    # 注意: 只用于 Prometheus pull 指标监听。
    host: 0.0.0.0
    # 描述: metrics HTTP 监听端口。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: -1 到 65535；-1 关闭监听，0 分配临时端口。
    # 默认值: 28080
    # 注意: 同一进程内多个 context 必须使用不同端口，避免争用。
    port: 28080

  statReporter:
    # 描述: 是否启用统计上报。
    # 类型: bool
    # 格式: true 或 false。
    # 范围: true / false。
    # 默认值: true
    # 注意: 启用时 chain 当前必须为 [prometheus]。
    enable: true
    # 描述: 统计上报插件链。
    # 类型: list[string]
    # 格式: 插件名列表。
    # 范围: 当前只支持 [prometheus]。
    # 默认值: [prometheus]
    # 注意: 空列表会被 set_default 补为 [prometheus]。
    chain: [prometheus]
    plugin:
      # prometheus 是当前唯一支持的统计上报插件。
      prometheus:
        # 描述: Prometheus 工作模式。
        # 类型: string
        # 格式: pull 或 push。
        # 范围: pull / push。
        # 默认值: pull
        # 注意: pull 启动 HTTP 监听；push 主动向 pushgateway 推送。
        type: pull
        # 描述: Prometheus pull 指标路径。
        # 类型: string
        # 格式: 以 / 开头且不含查询串的 HTTP path。
        # 范围: 合法绝对路径。
        # 默认值: /metric
        # 注意: 仅 type=pull 时用作监听路径。
        path: /metric
        # 描述: pushgateway 地址列表。
        # 类型: list[string]
        # 格式: host:port 或 http(s)://host:port。
        # 范围: 不含用户名、密码、query 或 fragment。
        # 默认值: []
        # 注意: type=push 时若为空，则优先使用 global.system.monitorCluster 寻址。
        address: []
        # 描述: pushgateway 服务发现命名空间。
        # 类型: string
        # 格式: 服务命名空间。
        # 范围: 任意字符串。
        # 默认值: Polaris
        # 注意: monitorCluster 的 namespace/service 均为空时才使用该兜底值。
        namespace: Polaris
        # 描述: pushgateway 服务名。
        # 类型: string
        # 格式: Polaris 服务名。
        # 范围: 任意字符串。
        # 默认值: polaris.pushgateway
        # 注意: monitorCluster 的 namespace/service 均为空时才使用该兜底值。
        service: polaris.pushgateway
        # 描述: push 指标周期。
        # 类型: duration
        # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
        # 范围: >=1000ms。
        # 默认值: 10s
        # 注意: 仅 type=push 时生效。
        pushInterval: 10s
        # 描述: push 请求是否使用 gzip。
        # 类型: bool
        # 格式: true 或 false。
        # 范围: true / false。
        # 默认值: false
        # 注意: 仅 type=push 时生效。
        openGzip: false
        # 描述: 方法聚合的正则列表。
        # 类型: list[string]
        # 格式: Python 正则表达式列表。
        # 范围: 每项必须是可编译正则；按顺序完整匹配 method。
        # 默认值: []
        # 注意: 匹配后以正则文本作为指标标签，避免高基数。
        pathRegexList: []
        # 描述: 上报时覆盖的 host 标签。
        # 类型: string
        # 格式: 任意字符串。
        # 范围: 任意字符串；空值表示不覆盖。
        # 默认值: ""
        # 注意: 当前用于指标标签展示，不改变实际上报网络地址。
        overrideHost: ""

provider:
  # 描述: 自动重注册的最小等待时间。
  # 类型: duration
  # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
  # 范围: >0；显式 0 会回退为默认值。
  # 默认值: 30s
  # 注意: 只影响连续 400202 后的重注册等待，不改变正常 TTL 心跳周期。
  minRegisterInterval: 30s

consumer:
  localCache:
    # 描述: 本地缓存类型。
    # 类型: string
    # 格式: 已注册缓存插件名。
    # 范围: inmemory。
    # 默认值: inmemory
    # 注意: 磁盘备份由文件缓存组件配合使用。
    type: inmemory
    # 描述: 闲置服务资源淘汰时间。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=5s。
    # 默认值: 24h
    # 注意: 业务读取续期；后台刷新不续期；系统服务不淘汰。
    serviceExpireTime: 24h
    # 描述: 服务发现刷新周期。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 2s
    # 注意: 控制后台 Discover 刷新节奏。
    serviceRefreshInterval: 2s
    # 描述: 磁盘备份目录。
    # 类型: string
    # 格式: 相对或绝对目录路径。
    # 范围: 可写目录；空字符串使用默认值。
    # 默认值: ./polaris/backup
    # 注意: 相对路径按进程工作目录解析；不同注册中心建议使用不同目录。
    persistDir: ./polaris/backup
    # 描述: 备份写入和删除的额外重试次数。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >=0；显式 0 会回退为默认值 5。
    # 默认值: 5
    # 注意: 次数不含首次操作；销毁时也会尝试排空写队列。
    persistMaxWriteRetry: 5
    # 描述: 备份读取的额外重试次数。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >=0；显式 0 会回退为默认值 1。
    # 默认值: 1
    # 注意: 文件缺失或过期不重试，仅 I/O、锁竞争和解析失败重试。
    persistMaxReadRetry: 1
    # 描述: 磁盘读写重试间隔。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=0。
    # 默认值: 1s
    # 注意: 读取、写入和删除重试共用该间隔。
    persistRetryInterval: 1s
    # 描述: 本地缓存插件参数。
    # 类型: map[string]map[string]any
    # 格式: 插件参数 mapping。
    # 范围: 当前没有可配置参数。
    # 默认值: {}
    # 注意: [预留] 可加载但不会改变缓存行为。
    plugin: {}

  serviceRouter:
    # 描述: 前置路由链。
    # 类型: list[string]
    # 格式: 按顺序执行的插件名列表。
    # 范围: isolatedRouter。
    # 默认值: [isolatedRouter]
    # 注意: 不能为空；isolatedRouter 剔除隔离实例和权重为 0 的实例。
    beforeChain: [isolatedRouter]
    # 描述: 主路由链。
    # 类型: list[string]
    # 格式: 按顺序执行的插件名列表。
    # 范围: metadataRouter。
    # 默认值: []
    # 注意: 默认为空，不执行 metadata 业务路由；需要时显式加入 metadataRouter。
    chain: []
    # 描述: 后置路由链。
    # 类型: list[string]
    # 格式: 按顺序执行的插件名列表。
    # 范围: recoverRouter。
    # 默认值: [recoverRouter]
    # 注意: 不能为空；recoverRouter 剔除不健康实例并按参数决定是否剔除熔断实例。
    afterChain: [recoverRouter]
    # 描述: 路由最小实例保留比例。
    # 类型: float
    # 格式: YAML 浮点数。
    # 范围: [0.0, 1.0)。
    # 默认值: 0.0
    # 注意: [预留] 当前路由插件不会读取该字段，配置不会改变过滤结果。
    percentOfMinInstances: 0.0
    # 描述: 服务路由插件参数。
    # 类型: map[string]map[string]any
    # 格式: 第一层 key 是路由插件名，第二层是该插件参数 mapping；camelCase 和 snake_case 均可识别。
    # 范围: metadataRouter 和 recoverRouter；isolatedRouter 不读取参数。
    # 默认值: {}
    # 注意: 只写需要覆盖的插件和字段；未写字段使用插件内置默认值。
    #
    # metadataRouter:
    #   metadataFailOverType | metadata_fail_over_type
    #     描述: metadata 精确匹配失败后的降级方式。
    #     类型: string（enum）
    #     格式: none | all | others
    #     默认值: all
    #     注意: all 返回原实例；others 返回缺少任一请求 key 的实例；none 抛出路由不匹配错误。
    #           请求 metadata_failover_type、服务 metadata internal-metadata-failover-type 优先于本参数。
    #           非法值在插件初始化时拒绝。
    #
    # recoverRouter:
    #   excludeCircuitBreakInstances | exclude_circuit_break_instances
    #     描述: 是否排除熔断状态为 Open 的实例。
    #     类型: bool
    #     格式: true | false
    #     默认值: true
    #     注意: 不健康实例始终排除；本开关只控制 Open 熔断实例。
    #
    #   allRecoverEnable | all_recover_enable
    #     描述: 过滤后无可用实例时，是否回退到进入 recoverRouter 前的完整实例集合。
    #     类型: bool
    #     格式: true | false
    #     默认值: true
    #     注意: false 时允许返回空集合。
    #
    # 自定义示例（需要时取消注释，默认配置不包含）：
    # plugin:
    #   metadataRouter:
    #     metadataFailOverType: none
    #   recoverRouter:
    #     excludeCircuitBreakInstances: false
    #     allRecoverEnable: false
    plugin: {}

  loadbalancer:
    # 描述: 单实例负载均衡算法。
    # 类型: string
    # 格式: 已注册负载均衡插件名。
    # 范围: weightedRandom、random；wr 会规范化为 weightedRandom。
    # 默认值: weightedRandom
    # 注意: 仅 get_one_instance / async_get_one_instance 执行负载均衡。
    type: weightedRandom
    # 描述: 负载均衡插件参数。
    # 类型: map[string]map[string]any
    # 格式: 插件参数 mapping。
    # 范围: 当前没有可配置参数。
    # 默认值: {}
    # 注意: [预留] 可加载但不会改变算法。
    plugin: {}

  circuitBreaker:
    # 描述: 是否启用本地实例熔断。
    # 类型: bool
    # 格式: true 或 false。
    # 范围: true / false。
    # 默认值: true
    # 注意: 关闭后不执行熔断统计、检查或恢复。
    enable: true
    # 描述: 熔断器后台补充检查周期。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=1s。
    # 默认值: 10s
    # 注意: 错误率检查和打开恢复另有独立定时。
    checkPeriod: 10s
    # 描述: 打开到半开的等待时间。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >=1s。
    # 默认值: 30s
    # 注意: 到期后进入半开，只允许有限探测请求。
    sleepWindow: 30s
    # 描述: 半开恢复成功数。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >0；显式 0 会回退为默认值 3。
    # 默认值: 3
    # 注意: 同时决定半开阶段的请求配额。
    successCountAfterHalfOpen: 3
    # 描述: 是否启用本地默认实例规则。
    # 类型: bool
    # 格式: true 或 false。
    # 范围: true / false。
    # 默认值: true
    # 注意: 关闭后不执行本地默认规则；当前不支持远端或其他层级规则。
    defaultRuleEnable: true
    # 描述: 连续失败熔断阈值。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >0。
    # 默认值: 10
    # 注意: 返回码 500-599 或 -1 计为失败。
    defaultErrorCount: 10
    # 描述: 错误率熔断阈值。
    # 类型: int
    # 格式: 整数百分比。
    # 范围: [0, 100]。
    # 默认值: 50
    # 注意: 达到最小请求数后才检查错误率。
    defaultErrorPercent: 50
    # 描述: 错误率统计窗口。
    # 类型: duration
    # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
    # 范围: >0。
    # 默认值: 60s
    # 注意: 首次失败后延迟该窗口检查，内部固定使用 10 个桶。
    defaultInterval: 60s
    # 描述: 错误率检查的最小请求数。
    # 类型: int
    # 格式: YAML 整数。
    # 范围: >0。
    # 默认值: 10
    # 注意: 样本不足时不会触发错误率熔断。
    defaultMinimumRequest: 10
    # 描述: 熔断插件链。
    # 类型: list[string]
    # 格式: 插件名列表。
    # 范围: composite；err_count 会规范化为 composite。
    # 默认值: [composite]
    # 注意: 空列表会回退为 composite。
    chain: [composite]
    # 描述: 熔断插件参数。
    # 类型: map[string]map[string]any
    # 格式: 插件参数 mapping。
    # 范围: 当前没有可配置参数。
    # 默认值: {}
    # 注意: [预留] 可加载但不会改变默认规则。
    plugin: {}

ai:
  skill:
    serverConnector:
      # 描述: Skill 服务连接器类型。
      # 类型: string
      # 格式: 已注册连接器类型。
      # 范围: polaris。
      # 默认值: polaris
      # 注意: 当前只支持 Polaris Skill 服务。
      connectorType: polaris
      # 描述: Skill 服务连接协议。
      # 类型: string
      # 格式: 协议名。
      # 范围: grpc。
      # 默认值: grpc
      # 注意: 与主注册中心连接相互独立。
      protocol: grpc
      # 描述: Skill 服务 gRPC 地址列表。
      # 类型: list[string]
      # 格式: host:port 或 [IPv6]:port。
      # 范围: 至少 1 项。
      # 默认值: [127.0.0.1:8094]
      # 注意: Skill 连接不读取 global.serverConnector.addresses。
      addresses: [127.0.0.1:8094]
      # 描述: Skill 服务访问令牌。
      # 类型: string
      # 格式: 服务端签发的 token。
      # 范围: 任意字符串；空值表示未鉴权。
      # 默认值: ""
      # 注意: 空值时在补默认配置阶段继承 global.serverConnector.token；显式配置优先。
      token: ""
      # 描述: Skill TLS 信任根证书文件。
      # 类型: string
      # 格式: PEM 文件路径。
      # 范围: 空值或可读取、可解析的 PEM。
      # 默认值: ""
      # 注意: 非空时校验 Skill 服务端证书；错误配置拒绝启动。
      trustedCAFile: ""
      # 描述: Skill mTLS 客户端证书。
      # 类型: string
      # 格式: PEM 文件路径。
      # 范围: 与 keyFile 同时配置或同时为空。
      # 默认值: ""
      # 注意: 证书和私钥必须成对。
      certFile: ""
      # 描述: Skill mTLS 客户端私钥。
      # 类型: string
      # 格式: PEM 文件路径。
      # 范围: 与 certFile 同时配置或同时为空。
      # 默认值: ""
      # 注意: 不匹配或不可读取时拒绝启动。
      keyFile: ""
      # 描述: Skill 一元 RPC 超时。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >0。
      # 默认值: 5s
      # 注意: 不用于 Skill 内容下载。
      messageTimeout: 5s
      # 描述: Skill 内容下载超时。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >0。
      # 默认值: 30s
      # 注意: 用于下载流和 ZIP 内容接收。
      downloadTimeout: 30s
      # 描述: 是否持久化 Skill 内容。
      # 类型: bool
      # 格式: true 或 false。
      # 范围: true / false。
      # 默认值: true
      # 注意: 开启时 persistDir 不能为空。
      persistEnable: true
      # 描述: Skill 本地持久化目录。
      # 类型: string
      # 格式: 相对或绝对目录路径。
      # 范围: persistEnable=true 时必须非空。
      # 默认值: ./polaris/backup/skill
      # 注意: 与 consumer.localCache.persistDir 相互独立。
      persistDir: ./polaris/backup/skill
      # 描述: Skill 写入重试次数。
      # 类型: int
      # 格式: YAML 整数。
      # 范围: >=0。
      # 默认值: 1
      # 注意: 次数不含首次操作。
      persistMaxWriteRetry: 1
      # 描述: Skill 读取重试次数。
      # 类型: int
      # 格式: YAML 整数。
      # 范围: >=0。
      # 默认值: 0
      # 注意: 缺失或过期备份不重试。
      persistMaxReadRetry: 0
      # 描述: Skill 磁盘重试间隔。
      # 类型: duration
      # 格式: 整数毫秒或 ns/us/ms/s/m/h 时长字符串。
      # 范围: >=0。
      # 默认值: 500ms
      # 注意: 读写重试共用该间隔。
      persistRetryInterval: 500ms
      # 描述: 远端失败时是否回退本地 Skill 备份。
      # 类型: bool
      # 格式: true 或 false。
      # 范围: true / false。
      # 默认值: true
      # 注意: 只在远端网络错误等允许降级的场景启用。
      fallbackToLocalCache: true
