[project]
name = "polaris-python"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "evelynwei", email = "evelynwei@tencent.com" }]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84.0",
    "polarismesh-specification @ git+https://github.com/polarismesh/specification.git@v1.9.0-alpha.1#subdirectory=source/python",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: tests requiring a running Polaris service",
]
